# .github/workflows/ci.yml — PhotoSweep CI

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Create Config.xcconfig
        run: |
          cat > Config.xcconfig << 'EOF'
          GOOGLE_CLIENT_ID = ci-test.apps.googleusercontent.com
          GOOGLE_REVERSED_CLIENT_ID = com.googleusercontent.apps.ci-test
          BUNDLE_ID = com.photosweep.ci
          APP_NAME = PhotoSweep
          TELEMETRY_APP_ID = ci-test
          SENTRY_DSN = https://ci-test@sentry.io/0
          DEEP_CLEAN_PRODUCT_ID = com.photosweep.ci.deepclean
          EOF

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict

      - name: Build
        run: |
          xcodebuild build \
            -project PhotoSweep.xcodeproj \
            -scheme PhotoSweep \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project PhotoSweep.xcodeproj \
            -scheme PhotoSweep \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults
      
      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
